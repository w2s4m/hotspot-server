<!doctype html>
<!-- ======================================================================
     صفحة المدير: https://hotspot-server-pcyf.onrender.com/admin
     - بتدخل بالـ ADMIN_KEY (المحفوظ بـ Render > Environment)
     - بتعرض: المخزون، كل البطاقات، التفعيلات، المبيعات، حالة الراوتر
     - بتضيف بطاقات (كل بطاقة بسطر: user pass)
     ====================================================================== -->
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WESAM TECH - المدير</title>
<style>
/* ألوان وتنسيقات الصفحة (غيّرها إذا بدك) */
body{margin:0;padding:16px;background:#0b0d14;color:#f5f2ea;font-family:Tahoma,Arial,sans-serif}
.box{max-width:760px;margin:0 auto 16px;padding:16px;border-radius:14px;background:#161a26;border:1px solid #2a3042}
h2{margin:0 0 12px;font-size:18px;color:#f7dc92}
input,select,textarea,button{font:inherit;width:100%;box-sizing:border-box;padding:10px;border-radius:10px;border:1px solid #333b52;background:#0b0d14;color:#fff;margin-bottom:8px}
textarea{min-height:160px;direction:ltr;font-family:monospace}
button{background:#e0b04a;color:#1b1303;font-weight:700;cursor:pointer;border:0}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px;border-bottom:1px solid #2a3042;text-align:right}
.stock{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:8px 12px;border-radius:10px;background:#0b0d14;border:1px solid #333b52}.low{border-color:#ff5a5f;color:#ff9a9d}
#msg{color:#34d399;min-height:20px}
</style></head><body>

<!-- نموذج الدخول -->
<div class="box"><h2>دخول المدير</h2><input id="key" type="password" placeholder="ADMIN_KEY"><button id="go">دخول</button></div>

<!-- كل المحتوى مخفي لحد ما تدخل بمفتاح صحيح -->
<div id="app" style="display:none">
 <div class="box"><h2>حالة الراوتر</h2><div id="router"></div></div>
 <div class="box"><h2>المخزون</h2><div class="stock" id="stock"></div></div>
 <div class="box"><h2>إضافة بطاقات</h2>
  <select id="plan"></select>
  <textarea id="cards" placeholder="كل بطاقة بسطر:&#10;user1 pass1&#10;abc123 xyz789&#10;(كود واحد؟ اكتبه لحاله)&#10;أي حروف وأرقام وأي طول (حتى 64)"></textarea>
  <button id="add">إضافة للمخزون</button><div id="msg"></div></div>
 <div class="box"><h2>كل البطاقات المتاحة</h2><div id="cardsList"></div></div>
 <div class="box"><h2>البطاقات المفعّلة</h2><div style="overflow-x:auto"><table><thead><tr><th>اليوزر</th><th>الباقة</th><th>التفعيل</th><th>تنتهي</th></tr></thead><tbody id="acts"></tbody></table></div></div>
 <div class="box"><h2>آخر المبيعات</h2><div style="overflow-x:auto"><table><thead><tr><th>الوقت</th><th>الباقة</th><th>السعر</th><th>اليوزر</th><th>الباسورد</th><th>الرصيد</th></tr></thead><tbody id="sales"></tbody></table></div></div>
</div>

<script>
// المفتاح بينحفظ بالمتصفح (sessionStorage) لحد ما تسكر التبويب
var KEY=sessionStorage.getItem('k')||'';
function $(i){return document.getElementById(i)}
// طلب للسيرفر مع مفتاح المدير
function api(path,opt){opt=opt||{};opt.headers=Object.assign({'x-admin-key':KEY,'Content-Type':'application/json'},opt.headers||{});return fetch(path,opt).then(function(r){return r.json()})}
// خلية جدول (textContent = آمن ضد XSS)
function td(t){var e=document.createElement('td');e.textContent=t;return e}
function dt(ms){return ms?new Date(ms).toLocaleString('en-GB'):'-'}

// تحميل وعرض كل البيانات
function load(){api('/api/admin/summary').then(function(d){
 if(!d.ok){$('app').style.display='none';return}
 $('app').style.display='block';

 // حالة الراوتر
 var r=d.router||{};
 $('router').textContent=r.t?((Date.now()-r.t<=180000?'🟢 متصل':'🔴 غير متصل')+' | IP العام: '+r.ip+' | IP الهوتسبت: '+r.hsIp+' | آخر إشارة: '+dt(r.t)):'⚪ لا توجد إشارة من الراوتر بعد';

 // المخزون + قائمة اختيار الباقة
 var st=$('stock');st.innerHTML='';var sel=$('plan');sel.innerHTML='';
 d.plans.forEach(function(p){var c=document.createElement('div');c.className='chip'+(d.stock[p.id]<3?' low':'');c.textContent=p.name+' ('+p.price+'₪): '+d.stock[p.id];st.appendChild(c);
  var o=document.createElement('option');o.value=p.id;o.textContent=p.name+' - '+p.price+' شيكل';sel.appendChild(o)});

 // كل البطاقات (قسم لكل باقة، بتضغط عليه بينفتح)
 var cl=$('cardsList');cl.innerHTML='';
 d.plans.forEach(function(p){var det=document.createElement('details');var sm=document.createElement('summary');sm.textContent=p.name+' - '+(d.cards[p.id]||[]).length+' بطاقة';sm.style.cssText='cursor:pointer;padding:8px 0';det.appendChild(sm);
  var pre=document.createElement('pre');pre.style.cssText='direction:ltr;text-align:left;background:#0b0d14;padding:10px;border-radius:10px;overflow:auto;margin:0 0 8px';
  pre.textContent=(d.cards[p.id]||[]).map(function(c){return c.u+'  '+c.p}).join('\n')||'(فاضي)';det.appendChild(pre);cl.appendChild(det)});

 // البطاقات المفعّلة
 var ta=$('acts');ta.innerHTML='';
 (d.acts||[]).forEach(function(a){var tr=document.createElement('tr');tr.appendChild(td(a.user));tr.appendChild(td(a.planName));tr.appendChild(td(dt(a.t)));tr.appendChild(td(a.exp?dt(a.exp):'دائمة'));ta.appendChild(tr)});

 // المبيعات
 var tb=$('sales');tb.innerHTML='';
 d.sales.forEach(function(s){var tr=document.createElement('tr');tr.appendChild(td(dt(s.t)));tr.appendChild(td(s.plan));tr.appendChild(td(s.price));tr.appendChild(td(s.user));tr.appendChild(td(s.pass||'-'));tr.appendChild(td(s.balance));tb.appendChild(tr)});
})}

// زر الدخول
$('go').onclick=function(){KEY=$('key').value;sessionStorage.setItem('k',KEY);load()};
// زر إضافة البطاقات
$('add').onclick=function(){api('/api/admin/cards',{method:'POST',body:JSON.stringify({planId:$('plan').value,text:$('cards').value})}).then(function(d){
 $('msg').textContent=d.ok?('تمت إضافة '+d.added+' بطاقة'+(d.dup?(' | تجاهلت '+d.dup+' مكررة'):'')+(d.bad?(' | '+d.bad+' سطر غير صالح'):'')+' | المخزون الآن: '+d.stock):(d.error||'خطأ');
 if(d.ok){$('cards').value='';load()}})};
if(KEY)load();
</script></body></html>
