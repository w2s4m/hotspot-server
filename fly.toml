# fly.toml app configuration file generated for hotspot-server on 2026-11-21T11:51:44Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'hotspot-server'
primary_region = 'ams'

[build]
[http_service]
  internal_port = 8078
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
